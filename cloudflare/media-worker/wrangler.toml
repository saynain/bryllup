name = "bryllup-media"
main = "src/index.ts"
compatibility_date = "2026-06-27"
workers_dev = true

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "bryllup-media"

[[d1_databases]]
binding = "DB"
database_name = "bryllup-media"
database_id = "7e4fccd7-d407-47f5-b266-92ab80f46ee8"
migrations_dir = "migrations"

[stream]
binding = "STREAM"

[images]
binding = "IMAGES"

[vars]
# Comma-separated origins allowed to call this Worker from the browser.
CORS_ORIGINS = "http://localhost:3000,https://test.bryllup.rylands.no,https://bryllup.rylands.no"

# Cloudflare Images delivery base, for example:
# https://imagedelivery.net/<account_hash>
# New image uploads use R2 to avoid Cloudflare Images plan/quota limits during the event.
IMAGE_UPLOAD_PROVIDER = "r2"
IMAGE_DELIVERY_BASE_URL = ""
IMAGE_VARIANT_PUBLIC = "public"
IMAGE_VARIANT_THUMB = "thumbnail"

# Upload caps are intentionally configurable instead of hard-coded in the UI.
MAX_IMAGE_BYTES = "50000000"
MAX_VIDEO_BYTES = "5368709120"
R2_MULTIPART_PART_BYTES = "5242880"
STREAM_BASIC_MAX_BYTES = "190000000"
STREAM_MAX_DURATION_SECONDS = "3600"
STREAM_UPLOAD_PROTOCOL = "r2-multipart"
